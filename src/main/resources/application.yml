server:
  port: ${SERVER_PORT:8085}

video:
  location: ${MOVIES_PATH:./videos}

logging:
  file:
    name: ${LOG_FILE:logs/video-streamer.log}
  level:
    root: INFO
    net.jk.app.videostreamer: INFO
    org.springframework.web: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

spring:
  freemarker:
    charset: UTF-8
    check-template-location: true
    enabled: true
    prefer-file-system-access: true
    suffix: .ftl
    template-loader-path: classpath:/templates/
